<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D International Pursuit Extreme - Fixed Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
            font-family: 'Courier New', Courier, monospace;
            position: fixed;
        }

        /* Overlay UI HUD styling - Mobile Responsive */
        #hud {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            background: rgba(20, 20, 20, 0.9);
            padding: 8px 20px;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            color: #fff;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
            color: #e74c3c;
            text-shadow: 0 0 5px rgba(231,76,60,0.5);
        }

        p {
            margin: 2px 0 6px 0;
            font-size: 10px;
            color: #aaa;
        }

        .btn {
            background: #e74c3c;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin: 2px;
            transition: 0.2s;
            display: inline-block;
        }

        .btn-file {
            background: #2ecc71;
        }

        input[type="file"] {
            display: none;
        }

        #stats-container {
            display: flex;
            justify-content: space-around;
            margin-top: 4px;
            border-top: 1px dashed #444;
            padding-top: 4px;
        }

        .stat-box {
            font-size: 14px;
            font-weight: bold;
        }

        #score-text { color: #f1c40f; }
        #level-text { color: #3498db; }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- MOBILE TOUCH CONTROLS OVERLAY --- */
        .touch-zone {
            position: absolute;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            touch-action: none;
        }

        /* Left Side Steer Buttons */
        #control-up {
            bottom: 110px;
            left: 20px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            font-size: 24px;
        }

        #control-down {
            bottom: 25px;
            left: 20px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            font-size: 24px;
        }

        /* Right Side Big Jump Pad */
        #control-jump {
            bottom: 25px;
            right: 20px;
            width: 100px;
            height: 100px;
            background: rgba(231, 76, 60, 0.15);
            border: 2px solid rgba(231, 76, 60, 0.4);
            border-radius: 50%;
            font-size: 16px;
            color: rgba(231, 76, 60, 0.6);
        }

        /* Visual Feedback Active State */
        .touch-zone:active {
            background: rgba(255, 255, 255, 0.3) !important;
            color: #fff !important;
        }
        #control-jump:active {
            background: rgba(231, 76, 60, 0.4) !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>🚨 PURSUIT EXTREME 🚨</h1>
        <p>WASD / Arrows on PC | Screen Overlay on Mobile</p>
        
        <label for="upload" class="btn btn-file">📸 Face</label>
        <input type="file" id="upload" accept="image/*">
        
        <button class="btn" id="start">▶ START ESCAPE</button>
        
        <div id="stats-container">
            <div class="stat-box">DIST: <span id="score-text">0m</span></div>
            <div class="stat-box">HEAT: <span id="level-text">1</span></div>
        </div>
    </div>

    <!-- Virtual D-Pad UI Layers -->
    <div class="touch-zone" id="control-up">▲</div>
    <div class="touch-zone" id="control-down">▼</div>
    <div class="touch-zone" id="control-jump">JUMP</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('upload');
        const startBtn = document.getElementById('start');
        const scoreDisplay = document.getElementById('score-text');
        const levelDisplay = document.getElementById('level-text');
        const hud = document.getElementById('hud');

        let running = false;
        let score = 0;
        let currentLevel = 1;
        let frameCount = 0;
        let keys = {};
        let cops = [];
        
        let spawnRate = 65; 
        let minSpawnRate = 18;
        let baseCopSpeed = 6;

        let customFace = null;
        let lanePositions = [];

        let particles = [];
        let windStreaks = [];
        let shockwaves = [];
        let screenShakeTime = 0;
        let screenShakeIntensity = 0;

        const player = {
            x: 80, y: 200, z: 0,             
            zVelocity: 0, gravity: 0.6,     
            width: 50, height: 50, 
            speed: 6, isJumping: false
        };

        // --- AUDIO SYSTEM ---
        function playSoundJump() {
            try {
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = tempCtx.createOscillator();
                let gain = tempCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, tempCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(480, tempCtx.currentTime + 0.18);
                
                gain.gain.setValueAtTime(0.15, tempCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, tempCtx.currentTime + 0.18);
                
                osc.connect(gain);
                gain.connect(tempCtx.destination);
                
                osc.start();
                osc.stop(tempCtx.currentTime + 0.18);
                
                setTimeout(() => { tempCtx.close(); }, 200);
            } catch(e) {
                console.log("Audio contextual lock active.");
            }
        }

        function triggerScreenShake(duration, intensity) {
            screenShakeTime = duration;
            screenShakeIntensity = intensity;
        }

        function createParticle(x, y, vx, vy, size, color, maxLife) {
            particles.push({ x, y, vx, vy, size, color, life: maxLife, maxLife });
        }

        function createShockwave(x, y, maxRadius, color) {
            shockwaves.push({ x, y, radius: 0, maxRadius, alpha: 1 });
        }

        function updateAndDrawFX() {
            if (Math.random() < 0.12 + (currentLevel * 0.04)) {
                windStreaks.push({
                    x: canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 12 + 12,
                    length: Math.random() * 60 + 30
                });
            }
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.13)';
            ctx.lineWidth = 1;
            for (let i = windStreaks.length - 1; i >= 0; i--) {
                let w = windStreaks[i];
                w.x -= w.speed;
                ctx.beginPath();
                ctx.moveTo(w.x, w.y);
                ctx.lineTo(w.x + w.length, w.y);
                ctx.stroke();
                if (w.x + w.length < 0) windStreaks.splice(i, 1);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                let s = shockwaves[i];
                s.radius += (s.maxRadius - s.radius) * 0.1;
                s.alpha -= 0.04;
                if (s.alpha <= 0) {
                    shockwaves.splice(i, 1);
                    continue;
                }
                ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                let alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color.replace('ALPHA', alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const playableHeight = canvas.height - 140; 
            lanePositions = [90, 90 + (playableHeight / 2), canvas.height - 90 - player.height];
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 200); });

        // --- TOUCH INTERFACE CONTROLS ---
        const btnUp = document.getElementById('control-up');
        const btnDown = document.getElementById('control-down');
        const btnJump = document.getElementById('control-jump');

        btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowUp'] = true; });
        btnUp.addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowUp'] = false; });
        
        btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowDown'] = true; });
        btnDown.addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowDown'] = false; });

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); keys['Space'] = true; });
        btnJump.addEventListener('touchend', (e) => { e.preventDefault(); keys['Space'] = false; });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => { customFace = img; };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyS", "KeyA", "KeyD"].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        startBtn.addEventListener('click', () => {
            if (!running) {
                hud.style.background = "rgba(20, 20, 20, 0.5)";
                resetGame();
                running = true;
                loop();
            }
        });

        class CopCruiser {
            constructor() {
                this.width = 95; this.height = 48; 
                this.y = lanePositions[Math.floor(Math.random() * lanePositions.length)] + 4;
                this.x = canvas.width + this.width; 
                this.speed = baseCopSpeed + Math.random() * 3 + (currentLevel * 1.5);
                this.sirenState = true;
            }
            update() {
                this.x -= this.speed;
                if (frameCount % Math.max(3, 8 - currentLevel) === 0) this.sirenState = !this.sirenState;

                if (Math.random() < 0.3) {
                    createParticle(this.x + this.width, this.y + this.height - 8, Math.random() * 2 + 1, 0, Math.random() * 3 + 1, 'rgba(140, 140, 140, ALPHA)', 20);
                }
                if (Math.random() < 0.25) {
                    let flareColor = this.sirenState ? 'rgba(232, 65, 24, ALPHA)' : 'rgba(0, 168, 255, ALPHA)';
                    createParticle(this.x + 40, this.y - 4, 0, 0, Math.random() * 5 + 2, flareColor, 12);
                }
            }
            draw() {
                ctx.fillStyle = '#1e3799'; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#dcdde1';
                ctx.fillRect(this.x + 15, this.y + 3, 15, this.height - 6);
                ctx.fillRect(this.x + 55, this.y + 3, 10, this.height - 6);
                ctx.fillStyle = this.sirenState ? '#e84118' : '#00a8ff';
                ctx.fillRect(this.x + 38, this.y - 6, 8, 6);
                ctx.fillStyle = this.sirenState ? '#00a8ff' : '#e84118';
                ctx.fillRect(this.x + 46, this.y - 6, 8, 6);
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 15, this.y + this.height - 3, 18, 5);
                ctx.fillRect(this.x + 62, this.y + this.height - 3, 18, 5);
                ctx.fillRect(this.x + 15, this.y - 2, 18, 5);
                ctx.fillRect(this.x + 62, this.y - 2, 18, 5);
            }
        }

        function resetGame() {
            score = 0; currentLevel = 1; frameCount = 0; cops = [];
            particles = []; windStreaks = []; shockwaves = [];
            spawnRate = 65; baseCopSpeed = 5.5; 
            resizeCanvas();
            
            player.x = 80; 
            player.y = lanePositions[1]; 
            player.z = 0; 
            player.zVelocity = 0; 
            player.isJumping = false;
            
            scoreDisplay.innerText = "0m"; levelDisplay.innerText = "1";
        }

        function handleDifficultyProgression() {
            let newLevel = 1;
            if (score >= 100) newLevel = 2;
            if (score >= 300) newLevel = 3;
            if (score >= 600) newLevel = 4;
            if (score >= 1000) newLevel = 5;

            if (newLevel !== currentLevel) {
                currentLevel = newLevel;
                levelDisplay.innerText = currentLevel;
                spawnRate = Math.max(minSpawnRate, 65 - (currentLevel * 9));
                baseCopSpeed = 5.5 + (currentLevel * 1.1);
                
                triggerScreenShake(18, 6);
                createShockwave(canvas.width / 2, canvas.height / 2, canvas.width, '#ffffff');
            }
        }

        function handlePhysics() {
            // Vertical movement (W/S or Up/Down Arrows)
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

            // Horizontal movement (A/D or Left/Right Arrows)
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

            // Jumping mechanics
            if (keys['Space'] && !player.isJumping) {
                player.zVelocity = 13.0; player.isJumping = true;
                playSoundJump(); 
                for(let i=0; i<6; i++) {
                    createParticle(player.x + player.width/2, player.y + player.height, (Math.random()-0.5)*3, (Math.random()-0.5)*1, Math.random()*4+2, 'rgba(200, 200, 200, ALPHA)', 15);
                }
            }
            if (player.isJumping) {
                player.z += player.zVelocity; player.zVelocity -= player.gravity;
                if (player.z <= 0) { 
                    player.z = 0; 
                    player.zVelocity = 0; 
                    player.isJumping = false; 
                    triggerScreenShake(6, 3);
                    createShockwave(player.x + player.width/2, player.y + player.height/2, 35, '#ffffff');
                }
            }
            
            // Boundary constraints
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 70) player.y = 70;
            if (player.y > canvas.height - player.height - 70) player.y = canvas.height - player.height - 70;

            // Ground running dust details
            if (!player.isJumping && frameCount % 4 === 0) {
                createParticle(player.x + 5, player.y + player.height - 4, -2, 0, Math.random() * 3 + 1, 'rgba(180, 180, 180, ALPHA)', 14);
            }
        }

        function drawRoad() {
            let roadColors = ['#2f3640', '#262c35', '#1e2229', '#15181e', '#0c0e12'];
            ctx.fillStyle = roadColors[currentLevel - 1];
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#57606f';
            ctx.fillRect(0, 0, canvas.width, 70);
            ctx.fillRect(0, canvas.height - 70, canvas.width, 70);

            ctx.strokeStyle = '#fbc531'; ctx.lineWidth = 4; ctx.setLineDash([40, 30]);
            ctx.lineDashOffset = frameCount * (9 + currentLevel * 1.8); 
            const steps = (canvas.height - 140) / 3;
            ctx.beginPath();
            ctx.moveTo(0, 70 + steps); ctx.lineTo(canvas.width, 70 + steps);
            ctx.moveTo(0, 70 + steps * 2); ctx.lineTo(canvas.width, 70 + steps * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPlayer() {
            const centerX = player.x + player.width / 2;
            const groundY = player.y + player.height / 2;
            const currentAirY = groundY - player.z;
            const runCycle = frameCount * (0.25 + currentLevel * 0.04);
            const bobbing = Math.sin(runCycle) * 4;
            const limbSwing = Math.sin(runCycle) * 18;
            const radius = player.width / 2;

            if (player.isJumping) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)'; ctx.beginPath();
                const shadowScale = Math.max(0.25, 1 - (player.z / 200));
                ctx.ellipse(centerX, groundY + radius - 4, radius * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
            ctx.beginPath(); 
            ctx.moveTo(centerX - 4, currentAirY + 10); ctx.lineTo(centerX - 12 - (player.isJumping ? 4 : limbSwing), currentAirY + 30);
            ctx.stroke();
            ctx.beginPath(); 
            ctx.moveTo(centerX + 4, currentAirY + 10); ctx.lineTo(centerX + 6 + (player.isJumping ? -8 : limbSwing), currentAirY + 30);
            ctx.stroke();

            ctx.save(); ctx.beginPath();
            ctx.arc(centerX, currentAirY + bobbing, radius, 0, Math.PI * 2); ctx.clip();

            if (customFace) {
                ctx.drawImage(customFace, centerX - radius, (currentAirY + bobbing) - radius, player.width, player.height);
            } else {
                ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(centerX, currentAirY + bobbing, radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.fillRect(centerX, (currentAirY + bobbing) - 6, 12, 6);
                ctx.beginPath(); ctx.arc(centerX + 12, (currentAirY + bobbing) - 3, 3, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
            ctx.strokeStyle = '#e84118'; ctx.lineWidth = 2.5; ctx.beginPath();
            ctx.arc(centerX, currentAirY + bobbing, radius, 0, Math.PI * 2); 
            ctx.stroke();
        }

        function rectIntersect(playerObj, copObj) {
            if (playerObj.z > 35) return false; 
            return playerObj.x < copObj.x + copObj.width && playerObj.x + playerObj.width > copObj.x &&
                   playerObj.y < copObj.y + copObj.height && playerObj.y + playerObj.height > copObj.y;
        }

        function loop() {
            if (!running) return;
            frameCount++;
            if (frameCount % 6 === 0) {
                score++; scoreDisplay.innerText = score + "m";
                handleDifficultyProgression();
            }

            ctx.save();
            if (screenShakeTime > 0) {
                let dx = (Math.random() - 0.5) * screenShakeIntensity;
                let dy = (Math.random() - 0.5) * screenShakeIntensity;
                ctx.translate(dx, dy);
                screenShakeTime--;
            }

            drawRoad(); 
            handlePhysics(); 
            
            if (frameCount % spawnRate === 0) cops.push(new CopCruiser());

            for (let i = cops.length - 1; i >= 0; i--) {
                cops[i].update(); cops[i].draw();

                if (rectIntersect(player, cops[i])) {
                    running = false;
                    
                    triggerScreenShake(30, 12);
                    for (let pIdx = 0; pIdx < 30; pIdx++) {
                        createParticle(player.x + player.width/2, player.y + player.height/2, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, Math.random() * 6 + 3, pIdx % 2 === 0 ? 'rgba(232, 65, 24, ALPHA)' : 'rgba(241, 196, 15, ALPHA)', 35);
                    }

                    hud.style.background = "rgba(20, 20, 20, 0.9)";
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
                    
                    ctx.fillStyle = '#e84118'; ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('BUSTED!', canvas.width / 2, canvas.height / 2 - 10);
                    
                    ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
                    ctx.fillText(`Fled ${score}m | Heat Level: ${currentLevel}`, canvas.width / 2, canvas.height / 2 + 30);
                    ctx.fillText('Tap START ESCAPE to retry', canvas.width / 2, canvas.height / 2 + 70);
                }
                if (cops[i].x < -150) cops.splice(i, 1);
            }

            drawPlayer();
            updateAndDrawFX(); 
            ctx.restore();

            requestAnimationFrame(loop);
        }

        resizeCanvas();
    </script>
</body>
</html>

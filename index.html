<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D International Pursuit Extreme - FX Edition</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Overlay UI HUD styling */
        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            background: rgba(20, 20, 20, 0.9);
            padding: 15px 30px;
            border: 2px solid #e74c3c;
            border-radius: 10px;
            color: #fff;
            min-width: 360px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            letter-spacing: 2px;
            color: #e74c3c;
            text-shadow: 0 0 5px rgba(231,76,60,0.5);
        }

        p {
            margin: 5px 0 10px 0;
            font-size: 11px;
            color: #aaa;
        }

        .btn {
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin: 5px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #c0392b;
        }

        .btn-file {
            background: #2ecc71;
        }

        .btn-file:hover {
            background: #27ae60;
        }

        input[type="file"] {
            display: none;
        }

        #stats-container {
            display: flex;
            justify-content: space-around;
            margin-top: 8px;
            border-top: 1px dashed #444;
            padding-top: 8px;
        }

        .stat-box {
            font-size: 16px;
            font-weight: bold;
        }

        #score-text { color: #f1c40f; }
        #level-text { color: #3498db; }

        /* Leaderboard Panel Layout */
        #leaderboard-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid #f1c40f;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            width: 280px;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.2);
        }

        #leaderboard-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
            color: #f1c40f;
            border-bottom: 1px solid #f1c40f;
            padding-bottom: 5px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 6px 0;
            opacity: 0.9;
        }

        .loading-text {
            text-align: center;
            font-size: 12px;
            color: #888;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>🚨 GLOBAL PURSUIT 🚨</h1>
        <p>WASD / ARROWS = Move | <b>SPACEBAR</b> = Jump</p>
        
        <label for="upload" class="btn btn-file">📸 Upload Face</label>
        <input type="file" id="upload" accept="image/*">
        
        <button class="btn" id="start">▶ START ESCAPE</button>
        
        <div id="stats-container">
            <div class="stat-box">DIST: <span id="score-text">0m</span></div>
            <div class="stat-box">HEAT LEVEL: <span id="level-text">1</span></div>
        </div>
    </div>

    <div id="leaderboard-panel">
        <h3>🌍 GLOBAL TOP 5</h3>
        <div id="leaderboard-content">
            <div class="loading-text">[SYNCING WITH CLOUD...]</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('upload');
        const startBtn = document.getElementById('start');
        const scoreDisplay = document.getElementById('score-text');
        const levelDisplay = document.getElementById('level-text');
        const hud = document.getElementById('hud');
        const leaderboardContent = document.getElementById('leaderboard-content');

        // Free Public Open Database API Endpoint (via kvdb.io)
        const GLOBAL_DB_URL = "https://kvdb.io/MN9vG7gGfN86N3H73ZJq5a/scores";

        let running = false;
        let score = 0;
        let currentLevel = 1;
        let frameCount = 0;
        let keys = {};
        let cops = [];
        
        let spawnRate = 65; 
        let minSpawnRate = 18;
        let baseCopSpeed = 6;

        let customFace = null;
        let lanePositions = [];

        // --- VISUAL EFFECTS ENGINE DATA ---
        let particles = [];
        let windStreaks = [];
        let shockwaves = [];
        let screenShakeTime = 0;
        let screenShakeIntensity = 0;

        // --- AUDIO ENGINE CENTRAL DATA ---
        let audioCtx = null;
        let bgmOscillator = null;
        let bgmGainNode = null;

        const player = {
            x: 150, y: 200, z: 0,             
            zVelocity: 0, gravity: 0.6,     
            width: 60, height: 60,
            speed: 7, isJumping: false
        };

        // --- AUDIO ENGINE PROCEDURAL GENERATION FUNCTIONS ---
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Build looping siren engine background track
            bgmOscillator = audioCtx.createOscillator();
            bgmGainNode = audioCtx.createGain();
            
            bgmOscillator.type = 'sawtooth';
            bgmOscillator.frequency.setValueAtTime(55, audioCtx.currentTime); // Deep pursuit drone rumble
            bgmGainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            
            bgmOscillator.connect(bgmGainNode);
            bgmGainNode.connect(audioCtx.destination);
            bgmOscillator.start();
        }

        function updateBgmPitch() {
            if (!audioCtx || !bgmOscillator) return;
            // Siren speed up and intensity curves based on heat tier
            const pitchMultiplier = 55 + (currentLevel * 12);
            const cycleSpeed = 0.005 + (currentLevel * 0.003);
            const dynamicSirenPitch = pitchMultiplier + (Math.sin(frameCount * cycleSpeed) * (20 + currentLevel * 8));
            bgmOscillator.frequency.setValueAtTime(dynamicSirenPitch, audioCtx.currentTime);
        }

        function playSoundJump() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(480, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }

        function playSoundLand() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(110, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playSoundCrash() {
            if (!audioCtx) return;
            // Stop ambient track rumbles instantly
            if(bgmGainNode) bgmGainNode.gain.setValueAtTime(0, audioCtx.currentTime);

            // Synthesize noisy impact crash explosion
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function playSoundLevelUp() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function triggerScreenShake(duration, intensity) {
            screenShakeTime = duration;
            screenShakeIntensity = intensity;
        }

        function createParticle(x, y, vx, vy, size, color, maxLife) {
            particles.push({ x, y, vx, vy, size, color, life: maxLife, maxLife });
        }

        function createShockwave(x, y, maxRadius, color) {
            shockwaves.push({ x, y, radius: 0, maxRadius, alpha: 1 });
        }

        function updateAndDrawFX() {
            // Wind environmental speed lines
            if (Math.random() < 0.15 + (currentLevel * 0.05)) {
                windStreaks.push({
                    x: canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 15 + 15,
                    length: Math.random() * 80 + 40
                });
            }
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = windStreaks.length - 1; i >= 0; i--) {
                let w = windStreaks[i];
                w.x -= w.speed;
                ctx.beginPath();
                ctx.moveTo(w.x, w.y);
                ctx.lineTo(w.x + w.length, w.y);
                ctx.stroke();
                if (w.x + w.length < 0) windStreaks.splice(i, 1);
            }

            // Shockwaves / Jump landing rings
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                let s = shockwaves[i];
                s.radius += (s.maxRadius - s.radius) * 0.1;
                s.alpha -= 0.04;
                if (s.alpha <= 0) {
                    shockwaves.splice(i, 1);
                    continue;
                }
                ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Standard running dust & siren smoke particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                
                let alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color.replace('ALPHA', alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const playableHeight = canvas.height - 180; 
            lanePositions = [110, 110 + (playableHeight / 2), canvas.height - 110 - player.height];
        }
        window.addEventListener('resize', resizeCanvas);

        function getPlayerUID() {
            let uid = localStorage.getItem('escape_uid');
            if(!uid) {
                uid = 'player_' + Math.random().toString(36).substring(2, 11);
                localStorage.setItem('escape_uid', uid);
            }
            return uid;
        }

        async function fetchGlobalLeaderboard() {
            try {
                const response = await fetch(GLOBAL_DB_URL);
                if (!response.ok) throw new Error("No database entries yet");
                const globalData = await response.json();
                
                let sortedList = Object.values(globalData).sort((a, b) => b.score - a.score).slice(0, 5);
                renderLeaderboardUI(sortedList);
            } catch (err) {
                renderLeaderboardUI([]);
            }
        }

        function renderLeaderboardUI(list) {
            leaderboardContent.innerHTML = "";
            if (list.length === 0) {
                leaderboardContent.innerHTML = '<div class="loading-text" style="animation: none; color: #666;">[ NO ACTIVE WANTED RUNNERS ]</div>';
                return;
            }
            list.forEach((entry, idx) => {
                leaderboardContent.innerHTML += `
                    <div class="leaderboard-row">
                        <span>${idx + 1}. ${entry.name}</span>
                        <span style="color: #f1c40f;">${entry.score}m</span>
                    </div>`;
            });
        }

        async function uploadScoreToGlobalCloud(finalScore) {
            let name = prompt("🎉 NEW RUN RECORD! Submit to International Leaderboard\nEnter your desired name (Max 10 chars):");
            if (!name || name.trim() === "") name = "Anonymous";
            name = name.trim().slice(0, 10);

            leaderboardContent.innerHTML = '<div class="loading-text">[UPLOADING SCORE...]</div>';

            try {
                let currentCloudData = {};
                try {
                    const res = await fetch(GLOBAL_DB_URL);
                    if(res.ok) currentCloudData = await res.json();
                } catch(e) {}

                const myUID = getPlayerUID();
                
                if(!currentCloudData[myUID] || finalScore > currentCloudData[myUID].score) {
                    currentCloudData[myUID] = { name: name, score: finalScore };
                }

                await fetch(GLOBAL_DB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentCloudData)
                });
                
            } catch (error) {
                console.error("Cloud database synchronization error: ", error);
            }

            fetchGlobalLeaderboard();
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => { customFace = img; };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Robust cross-browser interaction handler
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "KeyW" || e.code === "KeyS") {
                e.preventDefault(); 
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        startBtn.addEventListener('click', () => {
            initAudio(); // Activate browser sound drivers via user interaction callback boundary
            if (!running) {
                hud.style.background = "rgba(20, 20, 20, 0.5)";
                resetGame();
                running = true;
                loop();
            }
        });

        class CopCruiser {
            constructor() {
                this.width = 115; this.height = 58;
                this.y = lanePositions[Math.floor(Math.random() * lanePositions.length)] + 5;
                this.x = canvas.width + this.width; 
                this.speed = baseCopSpeed + Math.random() * 4 + (currentLevel * 1.8);
                this.sirenState = true;
            }
            update() {
                this.x -= this.speed;
                if (frameCount % Math.max(3, 8 - currentLevel) === 0) this.sirenState = !this.sirenState;

                if (Math.random() < 0.4) {
                    createParticle(
                        this.x + this.width, 
                        this.y + this.height - 10, 
                        Math.random() * 2 + 1, 
                        Math.random() * 1 - 0.5, 
                        Math.random() * 4 + 2, 
                        'rgba(140, 140, 140, ALPHA)', 
                    );
                }
                if (Math.random() < 0.3) {
                    let flareColor = this.sirenState ? 'rgba(232, 65, 24, ALPHA)' : 'rgba(0, 168, 255, ALPHA)';
                    createParticle(this.x + 50, this.y - 4, Math.random() * 1, 0, Math.random() * 6 + 3, flareColor, 15);
                }
                
                // Added: High-speed electric chase spark effects spilling off police cruisers
                if (Math.random() < 0.15) {
                    createParticle(
                        this.x + (Math.random() * this.width),
                        this.y + this.height - 2,
                        this.speed * 0.4,
                        -Math.random() * 3,
                        Math.random() * 3 + 1,
                        this.sirenState ? 'rgba(0, 168, 255, ALPHA)' : 'rgba(231, 76, 60, ALPHA)',
                        12
                    );
                }
            }
            draw() {
                ctx.fillStyle = '#1e3799'; 
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#dcdde1';
                ctx.fillRect(this.x + 20, this.y + 4, 18, this.height - 8);
                ctx.fillRect(this.x + 65, this.y + 4, 12, this.height - 8);
                ctx.fillStyle = this.sirenState ? '#e84118' : '#00a8ff';
                ctx.fillRect(this.x + 45, this.y - 8, 10, 8);
                ctx.fillStyle = this.sirenState ? '#00a8ff' : '#e84118';
                ctx.fillRect(this.x + 55, this.y - 8, 10, 8);
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 18, this.y + this.height - 4, 22, 6);
                ctx.fillRect(this.x + 75, this.y + this.height - 4, 22, 6);
                ctx.fillRect(this.x + 18, this.y - 2, 22, 6);
                ctx.fillRect(this.x + 75, this.y - 2, 22, 6);
            }
        }

        function resetGame() {
            score = 0; currentLevel = 1; frameCount = 0; cops = [];
            particles = []; windStreaks = []; shockwaves = [];
            spawnRate = 65; baseCopSpeed = 6; 
            resizeCanvas();
            
            // Reactivate soundtrack levels smoothly on layout rebuilds
            if (audioCtx && bgmGainNode) {
                bgmGainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            }
            
            player.x = 150; 
            player.y = lanePositions[1]; 
            player.z = 0; 
            player.zVelocity = 0; 
            player.isJumping = false;
            
            scoreDisplay.innerText = "0m"; levelDisplay.innerText = "1";
        }

        function handleDifficultyProgression() {
            let newLevel = 1;
            if (score >= 100) newLevel = 2;
            if (score >= 300) newLevel = 3;
            if (score >= 600) newLevel = 4;
            if (score >= 1000) newLevel = 5;

            if (newLevel !== currentLevel) {
                currentLevel = newLevel;
                levelDisplay.innerText = currentLevel;
                spawnRate = Math.max(minSpawnRate, 65 - (currentLevel * 9));
                baseCopSpeed = 6 + (currentLevel * 1.2);
                
                playSoundLevelUp(); // Added: Alert chime when difficulty elevates
                triggerScreenShake(20, 8);
                createShockwave(canvas.width / 2, canvas.height / 2, canvas.width, '#ffffff');
            }
        }

        function handlePhysics() {
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

            // Added: Nitro fire injection exhaust particle tracks while dashing rightward
            if ((keys['ArrowRight'] || keys['KeyD']) && frameCount % 2 === 0) {
                createParticle(
                    player.x, 
                    player.y + player.height / 2 + (Math.random() * 20 - 10),
                    -8 - Math.random() * 4,
                    (Math.random() - 0.5) * 3,
                    Math.random() * 6 + 3,
                    Math.random() > 0.5 ? 'rgba(230, 126, 34, ALPHA)' : 'rgba(231, 76, 60, ALPHA)',
                    15
                );
            }

            if (keys['Space'] && !player.isJumping) {
                player.zVelocity = 13.5; player.isJumping = true;
                playSoundJump(); // Added: Kinetic leap sweep synthesizer audio trigger
                for(let i=0; i<8; i++) {
                    createParticle(player.x + player.width/2, player.y + player.height, (Math.random()-0.5)*4, (Math.random()-0.5)*2, Math.random()*5+2, 'rgba(200, 200, 200, ALPHA)', 20);
                }
            }
            if (player.isJumping) {
                player.z += player.zVelocity; player.zVelocity -= player.gravity;
                if (player.z <= 0) { 
                    player.z = 0; 
                    player.zVelocity = 0; 
                    player.isJumping = false; 
                    playSoundLand(); // Added: Sub rumble shock impact sound
                    triggerScreenShake(8, 4);
                    createShockwave(player.x + player.width/2, player.y + player.height/2, 45, '#ffffff');
                }
            }
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 80) player.y = 80;
            if (player.y > canvas.height - player.height - 80) player.y = canvas.height - player.height - 80;

            if (!player.isJumping && frameCount % 3 === 0) {
                createParticle(
                    player.x + 10, 
                    player.y + player.height - 5, 
                    -Math.random() * 3 - 1, 
                    (Math.random() - 0.5) * 1, 
                    Math.random() * 4 + 2, 
                    'rgba(180, 180, 180, ALPHA)', 
                    18
                );
            }
        }

        function drawRoad() {
            let roadColors = ['#2f3640', '#262c35', '#1e2229', '#15181e', '#0c0e12'];
            ctx.fillStyle = roadColors[currentLevel - 1];
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#57606f';
            ctx.fillRect(0, 0, canvas.width, 80);
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);

            ctx.strokeStyle = '#fbc531'; ctx.lineWidth = 5; ctx.setLineDash([50, 40]);
            ctx.lineDashOffset = frameCount * (10 + currentLevel * 2); 
            const steps = (canvas.height - 160) / 3;
            ctx.beginPath();
            ctx.moveTo(0, 80 + steps); ctx.lineTo(canvas.width, 80 + steps);
            ctx.moveTo(0, 80 + steps * 2); ctx.lineTo(canvas.width, 80 + steps * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPlayer() {
            const centerX = player.x + player.width / 2;
            const groundY = player.y + player.height / 2;
            const currentAirY = groundY - player.z;
            const runCycle = frameCount * (0.25 + currentLevel * 0.04);
            const bobbing = Math.sin(runCycle) * 5;
            const limbSwing = Math.sin(runCycle) * 22;
            const radius = player.width / 2;

            if (player.isJumping) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)'; ctx.beginPath();
                const shadowScale = Math.max(0.25, 1 - (player.z / 250));
                ctx.ellipse(centerX, groundY + radius - 5, radius * shadowScale, 7 * shadowScale, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 7; ctx.lineCap = 'round';
            ctx.beginPath(); 
            ctx.moveTo(centerX - 6, currentAirY + 12); ctx.lineTo(centerX - 18 - (player.isJumping ? 5 : limbSwing), currentAirY + 36);
            ctx.stroke();
            ctx.beginPath(); 
            ctx.moveTo(centerX + 6, currentAirY + 12); ctx.lineTo(centerX + 8 + (player.isJumping ? -10 : limbSwing), currentAirY + 36);
            ctx.stroke();
            ctx.beginPath(); 
            ctx.moveTo(centerX, currentAirY - 5); ctx.lineTo(centerX - 18 - (player.isJumping ? -10 : limbSwing), currentAirY + 15);
            ctx.stroke();
            ctx.beginPath(); 
            ctx.moveTo(centerX, currentAirY - 5); ctx.lineTo(centerX + 18 + (player.isJumping ? 15 : limbSwing), currentAirY + 15);
            ctx.stroke();

            ctx.save(); ctx.beginPath();
            ctx.arc(centerX, currentAirY + bobbing, radius, 0, Math.PI * 2); ctx.clip();

            if (customFace) {
                ctx.drawImage(customFace, centerX - radius, (currentAirY + bobbing) - radius, player.width, player.height);
            } else {
                ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(centerX, currentAirY + bobbing, radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.fillRect(centerX, (currentAirY + bobbing) - 8, 18, 8);
                ctx.beginPath(); ctx.arc(centerX + 18, (currentAirY + bobbing) - 4, 4, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
            ctx.strokeStyle = '#e84118'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.arc(centerX, currentAirY + bobbing, radius, 0, Math.PI * 2); 
            ctx.stroke();
        }

        function rectIntersect(playerObj, copObj) {
            if (playerObj.z > 43) return false; 
            return playerObj.x < copObj.x + copObj.width && playerObj.x + playerObj.width > copObj.x &&
                   playerObj.y < copObj.y + copObj.height && playerObj.y + playerObj.height > copObj.y;
        }

        function loop() {
            if (!running) return;
            frameCount++;
            if (frameCount % 6 === 0) {
                score++; scoreDisplay.innerText = score + "m";
                handleDifficultyProgression();
            }

            updateBgmPitch(); // Process active background siren track modifications frame-by-frame

            ctx.save();
            if (screenShakeTime > 0) {
                let dx = (Math.random() - 0.5) * screenShakeIntensity;
                let dy = (Math.random() - 0.5) * screenShakeIntensity;
                ctx.translate(dx, dy);
                screenShakeTime--;
            }

            drawRoad(); 
            handlePhysics(); 
            
            if (frameCount % spawnRate === 0) cops.push(new CopCruiser());

            for (let i = cops.length - 1; i >= 0; i--) {
                cops[i].update(); cops[i].draw();

                if (rectIntersect(player, cops[i])) {
                    running = false;
                    playSoundCrash(); // Added: Explode synthesizer sound assets directly on collision block
                    
                    triggerScreenShake(35, 15);
                    for (let pIdx = 0; pIdx < 40; pIdx++) {
                        createParticle(
                            player.x + player.width/2, 
                            player.y + player.height/2, 
                            (Math.random() - 0.5) * 12, 
                            (Math.random() - 0.5) * 12, 
                            Math.random() * 8 + 4, 
                            pIdx % 2 === 0 ? 'rgba(232, 65, 24, ALPHA)' : 'rgba(241, 196, 15, ALPHA)', 
                            45
                        );
                    }

                    hud.style.background = "rgba(20, 20, 20, 0.9)";
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
                    
                    ctx.fillStyle = '#e84118'; ctx.font = 'bold 54px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('BUSTED!', canvas.width / 2, canvas.height / 2 - 20);
                    
                    ctx.fillStyle = '#fff'; ctx.font = '22px monospace';
                    ctx.fillText(`Fled ${score}m | Heat Level: ${currentLevel}`, canvas.width / 2, canvas.height / 2 + 35);
                    ctx.fillText('Press START ESCAPE to break out again', canvas.width / 2, canvas.height / 2 + 80);
                    
                    uploadScoreToGlobalCloud(score);
                }
                if (cops[i].x < -150) cops.splice(i, 1);
            }

            drawPlayer();
            updateAndDrawFX(); 
            ctx.restore();

            requestAnimationFrame(loop);
        }

        resizeCanvas();
        fetchGlobalLeaderboard();
    </script>
</body>
